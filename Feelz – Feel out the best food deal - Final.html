<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const DATA = JSON.parse(document.getElementById("data").textContent);
const mem = {};
const store = { get: k => { try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch {} return mem[k] ?? null; }, set: (k, v) => { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del: k => { delete mem[k]; try { localStorage.removeItem(k); } catch {} } };
const AK = "feelz_accounts", SK = "feelz_session";
const hash = async (e, p) => { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("feelz:" + e + ":" + p)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); };
const BTN = "mt-3 w-full rounded-xl bg-violet-700 py-2 text-sm font-semibold text-white dark:bg-yellow-400 dark:text-stone-900";
const fmt = n => "$" + n.toFixed(2);

// Pricing engine: total cost of a basket on one channel
function quote(S, tip, ch, cat) {
  const rate = cat === "Grocery" ? 0.01 : 0.1025;
  if (ch.p === "Pickup") {
    const promo = S * (ch.disc || 0) / 100, tax = (S - promo) * rate;
    return { total: S - promo + tax, base: S, fees: 0, promo, tip: 0, tax };
  }
  const base = S * (1 + ch.m / 100);
  const fees = ch.d + base * ch.s / 100 + (S > 0 && S < 12 ? 2 : 0);
  const promo = ch.promo && base >= ch.promo.min ? ch.promo.o : 0;
  const tax = base * rate, t = base * tip / 100;
  return { total: Math.max(0, base + fees + tax - promo + t), base, fees, promo, tip: t, tax };
}
function rank(place, S, tip, mode) {
  return place.ch
    .filter(c => mode === "any" || (mode === "pickup") === (c.p === "Pickup"))
    .map(c => ({ ch: c, q: quote(S, tip, c, place.cat) }))
    .sort((a, b) => a.q.total - b.q.total);
}
const dist = (pl, zip) => (pl.mi * zip.f).toFixed(1);
const ago = m => (m < 1 ? "just now" : m + " min ago");

const BADGE = { "DoorDash": "bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300", "Uber Eats": "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300", "GrubHub": "bg-orange-100 text-orange-800 dark:bg-orange-950 dark:text-orange-300", "Instacart": "bg-green-100 text-green-800 dark:bg-green-950 dark:text-green-300", "Walmart Delivery": "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300", "Postmates": "bg-yellow-100 text-yellow-800 dark:bg-yellow-950 dark:text-yellow-300", "Pickup": "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300" };
const Chip = ({ p }) => <span className={"rounded-full px-2 py-0.5 text-xs font-semibold " + BADGE[p]}>{p === "Pickup" ? "Pickup / direct" : p}</span>;
const Card = ({ children, className = "", ...r }) => <div className={"rounded-2xl border border-stone-200 bg-white p-4 dark:border-stone-700 dark:bg-stone-800 " + className} {...r}>{children}</div>;

    <path d="M39 76q7 6 14-2" stroke="#3b1d6e" strokeWidth="3" fill="none" strokeLinecap="round" />
  </svg>
);

  const notes = [["10%", "38%", "🍕", 0], ["82%", "46%", "🌮", 0.6], ["26%", "62%", "🍔", 1.1], ["68%", "34%", "🍟", 1.6]];

function Login({ onLogin }) {
  const [mode, setMode] = useState("login");
  const [biz, setBiz] = useState(false);
  const [f, setF] = useState({ name: "", email: "", pw: "" });
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const inp = "w-full rounded-xl bg-white px-4 py-3 text-stone-900 outline-none";
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const submit = async () => {
    const email = f.email.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) return setErr("Enter a valid email.");
    if (f.pw.length < 6) return setErr("Password needs at least 6 characters.");
    setBusy(true); setErr("");
    try {
      const h = await hash(email, f.pw), all = store.get(AK) || {}, a = all[email];
      if (mode === "signup") {
        if (a) { setBusy(false); return setErr("That email already has an account. Log in instead."); }
        const acct = { email, name: f.name.trim() || email.split("@")[0], role: biz ? "merchant" : "consumer", zip: DATA.zips[0].z, h };
        all[email] = acct; store.set(AK, all); store.set(SK, email); onLogin(acct);
      } else {
        if (!a || a.h !== h) { setBusy(false); return setErr("Email or password is incorrect."); }
        store.set(SK, email); onLogin(a);
      }
    } catch (e) { setErr("Something went wrong. Try again."); setBusy(false); }

function PlaceCard({ pl, zip, mode, tip, onOpen }) {
  const S = pl.menu[0].p + pl.menu[1].p;
  const r = rank(pl, S, tip, mode);
  if (!r.length) return null;
  const best = r[0], worst = r[r.length - 1];
  const save = worst.q.total - best.q.total;
  return (
    <Card onClick={() => onOpen(pl.id)} className="cursor-pointer active:scale-[.99]">
      <div className="flex items-start justify-between gap-2">
        <div>
          <h3 className="font-bold leading-tight">{pl.name}</h3>
          <p className="text-xs text-stone-500 dark:text-stone-400">{pl.cat} · {dist(pl, zip)} mi{pl.local ? " · Local" : ""}{pl.claimed ? " · ✓ Owner-verified" : ""}</p>

          <div className="text-xl font-black">{fmt(best.q.total)}</div>

function Deals({ zip, onOpen }) {

      .sort((a, b) => sort === "savings" ? b.s.save - a.s.save : sort === "price" ? a.s.best - b.s.best : a.p.mi - b.p.mi).map(x => x.p);

// Budget mode: rule-based mock; swap with a Claude API call later
function Budget({ zip, onOpen, start = 30 }) {
  const [budget, setBudget] = useState(start);
  const [people, setPeople] = useState(1);
  const label = c => { const m = {}; c.forEach(i => { m[i.n] = (m[i.n] || 0) + 1; }); return Object.entries(m).map(([n, k]) => (k > 1 ? k + "× " : "") + n).join(" + "); };
  const picks = useMemo(() => {
    const all = DATA.places.filter(p => p.cat !== "Grocery").map(pl => {
      const mains = pl.menu.filter(i => i.main).sort((a, b) => a.p - b.p);
      const sides = pl.menu.filter(i => !i.main).sort((a, b) => a.p - b.p);
      const tot = c => rank(pl, c.reduce((s, i) => s + i.p, 0), 15, "any")[0];
      const tiers = [Array.from({ length: people }, (_, i) => mains[i % mains.length]), Array(people).fill(mains[0]), Array(Math.ceil(people / 2)).fill(mains[0])];
      let chosen = tiers.find(c => tot(c).q.total <= budget) || tiers[2];
      if (tot(chosen).q.total <= budget) for (const s of sides) if (tot([...chosen, s]).q.total <= budget) chosen = [...chosen, s];
      return { pl, chosen, best: tot(chosen) };
    });
    const fit = all.filter(x => x.best.q.total <= budget).sort((a, b) => b.chosen.length - a.chosen.length || (b.pl.local - a.pl.local) || a.best.q.total - b.best.q.total).slice(0, 3);
    return fit.length ? fit : all.sort((a, b) => a.best.q.total - b.best.q.total).slice(0, 3);
  }, [budget, people]);
  const none = picks.some(p => p.best.q.total > budget);
  return (
    <div className="space-y-4">
      <Card>
        <label className="text-sm font-medium">My budget: <span className="font-black">${budget}</span></label>
        <input type="range" min="5" max="80" value={budget} onChange={e => setBudget(+e.target.value)} className="mt-2 w-full accent-violet-500" />
        <div className="mt-2 flex gap-2">{[10, 15, 25, 40, 60].map(v => <button key={v} onClick={() => setBudget(v)} className={"rounded-full border px-3 py-1 text-xs " + (budget === v ? "border-violet-700 bg-violet-700 text-white" : "border-stone-300 dark:border-stone-600")}>${v}</button>)}</div>
        <div className="mt-3 flex flex-wrap items-center gap-3 text-sm">
          <span>Eating:</span>
          {[1, 2, 3, 4].map(n => <button key={n} onClick={() => setPeople(n)} className={"h-9 min-w-9 rounded-full border px-2 " + ((n === 4 ? people >= 4 : people === n) ? "border-violet-700 bg-violet-700 text-white dark:border-yellow-400 dark:bg-yellow-400 dark:text-stone-900" : "border-stone-300 dark:border-stone-600")}>{n === 4 ? "4+" : n}</button>)}
          <span className="text-stone-500 dark:text-stone-400">{people === 1 ? "person" : "people"}</span>
          {people >= 4 && <span className="ml-auto flex items-center gap-2"><button aria-label="Fewer people" onClick={() => setPeople(p => Math.max(4, p - 1))} className="h-8 w-8 rounded-full bg-stone-200 font-bold dark:bg-stone-700">−</button><b>{people}</b><button aria-label="More people" onClick={() => setPeople(p => Math.min(12, p + 1))} className="h-8 w-8 rounded-full bg-yellow-400 font-bold text-stone-900">+</button></span>}
        </div>
        <p className="mt-2 text-xs text-stone-500 dark:text-stone-400">Totals include fees, est. tax, and a 15% tip on delivery.</p>
      </Card>
      {none && <p className="text-sm font-medium">Nothing fits ${budget} for {people} exactly, so here are the closest options.</p>}
      {picks.map(({ pl, chosen, best }) => { const over = best.q.total - budget; const shared = chosen.filter(i => i.main).length < people; return (
        <Card key={pl.id} onClick={() => onOpen(pl.id)} className="cursor-pointer">
          <div className="flex justify-between"><h3 className="font-bold">{pl.name}</h3><span className="font-black">{fmt(best.q.total)}</span></div>
          <p className="mt-1 text-sm">{label(chosen)}</p>
          <div className="mt-2 flex items-center gap-2 text-xs"><Chip p={best.ch.p} /><span className="text-stone-500 dark:text-stone-400">{dist(pl, zip)} mi{pl.local ? " · Local" : ""}</span>{shared && <span className="rounded bg-violet-100 px-1.5 py-0.5 font-semibold text-violet-800 dark:bg-violet-900 dark:text-violet-200">Shared</span>}</div>
          {over > 0 && <p className="mt-2 text-xs font-medium text-violet-700 dark:text-yellow-300">{fmt(over)} over. Try ${Math.ceil(best.q.total)}.</p>}
        </Card>); })}
    </div>
  );
}

      <h2 className="text-xl font-black">Spots near {zip.n}</h2>
      <div className="overflow-hidden rounded-2xl border border-violet-200 bg-violet-50 dark:border-violet-900 dark:bg-violet-950">
        <svg viewBox="0 0 300 340" className="block w-full" role="img" aria-label="Map of nearby food spots">
          {[60, 120, 180, 240, 300].map(v => <path key={"h" + v} d={`M0 ${v}H300`} strokeWidth="6" className="stroke-violet-200 dark:stroke-violet-900" />)}
          {[50, 110, 170, 230, 280].map(v => <path key={"v" + v} d={`M${v} 0V340`} strokeWidth="6" className="stroke-violet-200 dark:stroke-violet-900" />)}
          <circle cx="150" cy="170" r="15" fill="#38bdf8" opacity=".3" /><circle cx="150" cy="170" r="6" fill="#0284c7" stroke="#fff" strokeWidth="2" />
          <text x="150" y="196" textAnchor="middle" fontSize="10" fontWeight="700" className="fill-sky-700 dark:fill-sky-300">You are here</text>
          {pins.map(({ p, x, y }) => <g key={p.id} onClick={() => setSel(p.id)} className="cursor-pointer"><circle cx={x} cy={y} r="12" fill={sel === p.id ? "#facc15" : "#7c3aed"} stroke="#fff" strokeWidth="2" /><text x={x} y={y + 4} textAnchor="middle" fontSize="11">🍴</text></g>)}
        </svg>
      </div>
      {pl ? <PlaceCard pl={pl} zip={zip} mode="any" tip={0} onOpen={onOpen} /> : <p className="text-center text-sm text-stone-500 dark:text-stone-400">Tap a spot to see its best deal.</p>}
    </div>
  );
}

function Events({ kind, zip }) {
  const zn = z => DATA.zips.find(x => x.z === z).n;
  const list = DATA.events.filter(e => e.k === kind).sort((a, b) => (b.z === zip.z) - (a.z === zip.z));
  return (
    <div className="space-y-3">
      <h2 className="text-xl font-black">{kind === "event" ? "Community events" : "Entertainment"}</h2>
      <p className="text-xs text-stone-600 dark:text-stone-400">{zip.n} first, then nearby. Mock listings; a backend scraper would pull these from village, library, park district, and venue calendars.</p>
      {list.map((e, i) => (
        <Card key={i} className="flex items-center gap-3">
          <span className="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-violet-100 text-xl dark:bg-violet-900">{e.i}</span>
          <div><div className="font-bold">{e.t}</div><div className="text-xs text-stone-500 dark:text-stone-400">{e.w} · {e.at}</div>
          <div className={"mt-1 text-xs font-semibold " + (e.z === zip.z ? "text-violet-700 dark:text-yellow-300" : "text-stone-400")}>{e.z === zip.z ? "📍 In " : "Nearby · "}{zn(e.z)} · via {e.src}</div></div>
        </Card>
      ))}
    </div>
  );
}

function Biz({ role, toast }) {
  const m = role === "merchant";
  return (
    <div className="space-y-3">
      <h2 className="text-xl font-black">Business owners</h2>
      <p className="text-sm text-stone-500 dark:text-stone-400">{m ? "Claim your page to post Feelz and hours." : "Know an owner? Invite them to claim their page."}</p>
      {DATA.places.filter(p => !p.claimed).map(p => (
        <Card key={p.id} className="flex items-center justify-between">
          <div><div className="font-bold">{p.name}</div><div className="text-xs text-stone-500 dark:text-stone-400">{p.cat} · unclaimed</div></div>
          <button onClick={() => toast("Demo: " + (m ? "claim request sent for " + p.name : "invite sent"))} className="rounded-xl bg-violet-600 px-3 py-2 text-sm font-semibold text-white">{m ? "Claim" : "Invite"}</button>
        </Card>
      ))}
    </div>
  );
}

function Info() {
  const plats = {};
  DATA.places.forEach(p => p.ch.forEach(c => { plats[c.p] = Math.min(plats[c.p] ?? 99, c.t); }));
  return (
    <div className="space-y-4">
      <Card><h2 className="text-xl font-black">How Feelz works</h2><p className="mt-2 text-sm">Feelz feels for menu prices, fees, and promos from each vendor, adds up markup, fees, estimated tax, promos, and your tip for your exact order, and shows the cheapest way to get it. Pickup and local picks are highlighted to keep dollars in your community.</p></Card>
      <Card><h3 className="mb-2 font-bold">Vendor feeds</h3>{Object.entries(plats).map(([p, t]) => <div key={p} className="flex items-center justify-between py-1.5 text-sm"><Chip p={p} /><span className="text-stone-500 dark:text-stone-400">synced {ago(t)}</span></div>)}</Card>
    </div>
  );
}

function Settings() {
  return (
    <div className="space-y-4">
      <h2 className="text-xl font-black">Settings</h2>
      <Card><p className="text-sm">Theme follows your device’s light or dark mode.</p></Card>
      <Card><p className="text-sm">Prices on Home are shown before tip. You choose a tip at checkout.</p></Card>
    </div>
  );
}

function Account({ user, setUser, zip, setZip, logout, toast }) {
  const [name, setName] = useState(user.name);
  const save = () => {
    const u = { ...user, name: name.trim() || user.name, zip: zip.z };
    if (!user.guest) { const all = store.get(AK) || {}; all[user.email] = { ...all[user.email], name: u.name, zip: u.zip }; store.set(AK, all); }
    setUser(u); toast("Profile saved");
  };
  const fld = "mt-1 w-full rounded-xl border border-stone-300 bg-white px-3 py-2 text-stone-900";
  return (
    <div className="space-y-4">
      <h2 className="text-xl font-black">My profile</h2>
      <Card className="flex flex-col items-center gap-1 text-center">
        <span className="grid h-24 w-24 place-items-center rounded-full bg-violet-100 dark:bg-violet-900"><Mascot size={72} /></span>
        <div className="mt-1 font-bold">{user.name}</div>
        <div className="text-xs text-stone-500 dark:text-stone-400">{user.guest ? "Guest (not saved)" : user.email} · {user.role === "merchant" ? "Business owner" : "Customer"}</div>
      </Card>
      <Card className="space-y-3">
        <label className="block text-sm font-medium">Display name<input value={name} onChange={e => setName(e.target.value)} className={fld} /></label>
        <label className="block text-sm font-medium">Home area<select value={zip.z} onChange={e => setZip(DATA.zips.find(z => z.z === e.target.value))} className={fld}>{DATA.zips.map(z => <option key={z.z} value={z.z}>{z.n} {z.z}</option>)}</select></label>
        <button onClick={save} className={BTN}>Save profile</button>
      </Card>
      <button onClick={logout} className="w-full rounded-xl bg-violet-600 py-3 font-semibold text-white">Log out</button>
    </div>
  );
}

function App() {
  const [splash, setSplash] = useState(true);
  const [user, setUser] = useState(() => { const e = store.get(SK); return e ? (store.get(AK) || {})[e] || null : null; });
  const role = user && user.role;
  const [scr, setScr] = useState("home");
  const [open, setOpen] = useState(null);
  const [drawer, setDrawer] = useState(false);
  const [zip, setZip] = useState(() => DATA.zips.find(z => z.z === (user && user.zip)) || DATA.zips[0]);
  const [bud, setBud] = useState(30);
  const [msg, setMsg] = useState("");
  const [sync, setSync] = useState("Demo data · synced 12 min ago");
  useEffect(() => { const t = setTimeout(() => setSplash(false), 2000); return () => clearTimeout(t); }, []);
  const toast = m => { setMsg(m); setTimeout(() => setMsg(""), 2200); };
  const doSync = () => { setSync("Syncing vendors…"); setTimeout(() => setSync("Synced just now (demo)"), 900); };
  const go = s => { setScr(s); setOpen(null); window.scrollTo(0, 0); };
  const openPlace = id => { setOpen(id); window.scrollTo(0, 0); };
  if (splash) return <Splash />;
  if (!user) return <Login onLogin={u => { setUser(u); const z = DATA.zips.find(x => x.z === u.zip); if (z) setZip(z); }} />;
  const place = open && DATA.places.find(p => p.id === open);
  const Tab = ({ id, icon, l }) => <button onClick={() => go(id)} className={"flex-1 py-2 text-xs font-semibold " + (scr === id && !open ? "text-violet-600 dark:text-yellow-300" : "text-stone-500")}><div className="text-xl">{icon}</div>{l}</button>;
  return (
    <div className="mx-auto min-h-screen max-w-md pb-24">
      <Drawer open={drawer} onClose={() => setDrawer(false)} go={go} role={role} />
      <header className="sticky z-20 bg-gradient-to-r from-violet-800 to-indigo-700 px-4 py-3 text-white" style={{ top: "env(safe-area-inset-top,0px)" }}>
        <div className="flex items-center gap-3">
          <button aria-label="Open menu" onClick={() => setDrawer(true)} className="text-2xl">☰</button>
          <Mark /><span className="text-2xl font-black italic">Feelz</span>
          <select aria-label="Choose your area" value={zip.z} onChange={e => setZip(DATA.zips.find(z => z.z === e.target.value))} className="ml-auto rounded-lg bg-white/15 px-2 py-1 text-sm text-white">
            {DATA.zips.map(z => <option key={z.z} value={z.z} className="text-stone-900">{z.n} {z.z}</option>)}
          </select>
          <button aria-label="My account" onClick={() => go("account")} className="grid h-9 w-9 place-items-center rounded-full bg-violet-100"><Mascot size={28} /></button>
        </div>
        <div className="mt-1 flex items-center justify-between text-xs text-violet-200">
          <span>{sync}</span>
          <button onClick={doSync} className="font-bold text-yellow-300 underline">Sync</button>
        </div>
      </header>
      <main className="px-4 pt-4">
        {place ? <PlacePage key={place.id} pl={place} zip={zip} onBack={() => setOpen(null)} toast={toast} />
          : scr === "home" ? <Home zip={zip} onOpen={openPlace} go={go} onBudget={n => { setBud(n); go("budget"); }} />
          : scr === "budget" ? <Budget key={bud} start={bud} zip={zip} onOpen={openPlace} />
          : scr === "map" ? <MapView zip={zip} onOpen={openPlace} />
          : scr === "friends" ? <Friends onOpen={openPlace} />
          : scr === "info" ? <Info />
          : scr === "events" || scr === "fun" ? <Events zip={zip} kind={scr === "fun" ? "fun" : "event"} />
          : scr === "biz" ? <Biz role={role} toast={toast} />
          : scr === "account" ? <Account user={user} setUser={setUser} zip={zip} setZip={setZip} toast={toast} logout={() => { store.del(SK); setUser(null); setScr("home"); }} />
          : <Settings />}
        <p className="mt-6 text-center text-xs text-violet-900/70 dark:text-violet-300">Prototype · all businesses and prices are fictional mock data</p>
      </main>
      <nav className="fixed inset-x-0 bottom-0 z-20 border-t border-stone-200 bg-white dark:border-stone-700 dark:bg-stone-900" style={{ paddingBottom: "env(safe-area-inset-bottom,0px)" }}>
        <div className="mx-auto flex max-w-md"><Tab id="map" icon="📍" l="Map" /><Tab id="friends" icon="👥" l="Community" /><Tab id="home" icon="🏠" l="Home" /><Tab id="info" icon="ℹ️" l="Info" /></div>
      </nav>
      {msg && <div className="fixed inset-x-4 bottom-24 z-20 mx-auto max-w-sm rounded-xl bg-stone-900 px-4 py-2 text-center text-sm text-white shadow-lg">{msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
